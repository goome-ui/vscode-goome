name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: package.json says the right version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "$v" = "${TAG#v}" ] || { echo "package.json is $v, not ${TAG#v}"; exit 1; }
      - name: goome sources
        run: |
          mkdir -p deps
          for r in docs c-goome rust-goome node-goome go-goome zig-goome lua-goome godot-goome; do
            git clone -q --depth 1 "https://github.com/goome-ui/$r.git" "deps/$r"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run unit
      - name: package
        run: npx @vscode/vsce package -o "vscode-goome-${TAG#v}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-goome-*.vsix
      - name: upload
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "vscode-goome ${TAG#v}" --notes "vscode-goome ${TAG#v}. Grab the .vsix below and install it with Extensions > ... > Install from VSIX."
          gh release upload "$TAG" "vscode-goome-${TAG#v}.vsix" --clobber

  marketplace:
    needs: vsix
    if: vars.MARKETPLACE_PUBLISH == 'yes'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: publish
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --skip-duplicate --packagePath "vscode-goome-${TAG#v}.vsix"

  openvsx:
    needs: vsix
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: publish
        run: npx --yes ovsx publish "vscode-goome-${TAG#v}.vsix"
